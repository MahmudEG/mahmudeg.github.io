<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Mahmud Elgoueri</title>
  <meta name="robots" content="noindex">
  <script>
    // Safety net: the blog moved from the site root to /blog. Static redirect
    // stubs cover every page that existed at the move; this catches anything
    // else (typos in old links, future moved paths). One hop only — if the
    // path already starts with /blog, we just show the 404.
    (function () {
      var p = window.location.pathname;
      if (p.indexOf("/blog") !== 0 && p !== "/" && p.indexOf(".") === -1) {
        window.location.replace("/blog" + p + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0a0a0c; color: #e9e9ec;
      font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }
    .box { text-align: center; padding: 24px; }
    h1 { color: #00e68a; font-size: 42px; margin: 0 0 8px; }
    p { color: #9a9aa3; }
    a { color: #49ffb2; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>route not found — command not recognized</p>
    <p><a href="/">← back to the landing page</a> · <a href="/blog/">browse the blog</a></p>
  </div>
</body>
</html>
