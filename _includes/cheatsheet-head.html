<!-- Shared <head> for the cheat sheet index and individual sheets.
     These pages are built under /blog/cheatsheet/ and moved to the site root by
     tools/assemble-site.sh, so every asset path here is root-absolute. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ include.title }}</title>
<meta name="description" content="{{ include.description }}">
<meta name="author" content="Mahmud Elgoueri">
<meta name="theme-color" content="#0a0a0c">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">

<meta property="og:type" content="article">
<meta property="og:site_name" content="Mahmud Elgoueri">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:title" content="{{ include.title }}">
<meta property="og:description" content="{{ include.description }}">
<meta property="og:image" content="{{ site.url }}/assets/img/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ include.title }}">
<meta name="twitter:description" content="{{ include.description }}">
<meta name="twitter:image" content="{{ site.url }}/assets/img/og-cover.png">

<link rel="icon" href="{{ site.url }}/assets/img/favicons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&family=Lato:wght@300;400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v=7">
<link rel="stylesheet" href="/assets/css/cheatsheet.css?v=1">

<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-VY6YFKLCKW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-VY6YFKLCKW');
</script>
